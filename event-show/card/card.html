<!doctype html>
<html><head><meta charset="utf-8"><title>Birthday card</title>
<style>
@font-face { font-family: Cormorant; font-weight: 500; font-style: normal; src: url(fonts/cormorant-garamond-latin-500-normal.woff2); }
@font-face { font-family: Cormorant; font-weight: 600; font-style: normal; src: url(fonts/cormorant-garamond-latin-600-normal.woff2); }
@font-face { font-family: Cormorant; font-weight: 400; font-style: italic; src: url(fonts/cormorant-garamond-latin-400-italic.woff2); }
@font-face { font-family: Cormorant; font-weight: 500; font-style: italic; src: url(fonts/cormorant-garamond-latin-500-italic.woff2); }
@font-face { font-family: Cormorant; font-weight: 600; font-style: italic; src: url(fonts/cormorant-garamond-latin-600-italic.woff2); }
@font-face { font-family: Karla; font-weight: 600; src: url(fonts/karla-latin-600-normal.woff2); }
:root { --ground:#1f1426; --ink:#f6ece6; --muted:#c9b6c4; --gold:#e3c07a; --blush:#e8a3a8; --line:rgba(227,192,122,.35); }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); color: var(--ink); }
#bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% -10%, #3a2344 0%, var(--ground) 62%); }
#fx { position: absolute; inset: 0; pointer-events: none; }
#stage { position: absolute; inset: 0; z-index: 2; }
.layer { position: absolute; inset: 0; opacity: 0; }
/* Opening */
#open { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
#open .greet { font: italic 400 60px Cormorant, serif; color: var(--muted); margin-bottom: 70px; }
#open .date { font: 600 20px Karla, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); margin-top: 60px; }
#open h1 { margin: 10px 0 0; font-family: Cormorant, serif; font-weight: 500; line-height: 1; }
#open h1 .s { display: block; font-size: 70px; font-style: italic; color: var(--muted); }
#open h1 .n { display: block; font-size: 260px; font-style: italic; font-weight: 600; }
#open h1 .n span { color: var(--gold); }
/* Hold */
#hold { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
#hold .eb { font: 600 22px Karla, sans-serif; letter-spacing: .4em; text-transform: uppercase; color: var(--gold); }
#hold h2 { margin: 30px 0 22px; font: italic 500 120px/1 Cormorant, serif; }
#hold .sub { font: italic 400 44px Cormorant, serif; color: var(--muted); }
/* Scenes */
.frame { position: absolute; left: 150px; top: 100px; width: 740px; height: 880px; padding: 16px; background: #f4ece2; box-shadow: 0 30px 70px rgba(0,0,0,.55); }
.frame .im { width: 100%; height: 100%; overflow: hidden; position: relative; }
.frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 40%; }
.text { position: absolute; left: 1010px; width: 790px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 34px; }
.text p { margin: 0; font: 500 46px/1.42 Cormorant, serif; color: var(--ink); }
.text p em { color: var(--gold); font-style: italic; }
.text .rule { width: 90px; height: 2px; background: var(--gold); opacity: .7; }
/* Finale */
.pol { position: absolute; padding: 12px; background: #f4ece2; box-shadow: 0 24px 50px rgba(0,0,0,.5); }
.pol div { width: 100%; height: 100%; overflow: hidden; }
.pol img { width: 100%; height: 100%; object-fit: cover; }
#fin .title { position: absolute; left: 0; right: 0; top: 585px; text-align: center; font: italic 600 150px/1 Cormorant, serif; }
#fin .title span { color: var(--gold); }
#fin .wish { position: absolute; left: 0; right: 0; top: 770px; text-align: center; font: 500 46px Cormorant, serif; color: var(--muted); }
#fin .sign { position: absolute; left: 0; right: 0; top: 865px; text-align: center; font: italic 500 64px Cormorant, serif; color: var(--blush); }
</style>
<script src="content.js"></script><!-- copy content.example.js to content.js -->
</head>
<body>
<div id="bg"></div>
<div id="stage"></div>
<canvas id="fx" width="1920" height="1080"></canvas>
<script>
const C = window.CONTENT, W = 1920, H = 1080, P = 20;          // P: confetti period, so the finale loops seamlessly
const stage = document.getElementById('stage');
const ph = (n) => `photos/${n}.jpg`;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const fade = (t, a, b, inD = 1.2, outD = 1.2) => ease((t - a) / inD) * (1 - ease((t - (b - outD)) / outD));
const words = (s) => s.replace(/<[^>]+>/g, '').split(/\s+/).length;

// ---------- timeline ----------
const T = { openEnd: 10 };
let t0 = T.openEnd - 0.6;
T.scenes = C.scenes.map((s) => {
  const r1 = 1.4 + words(s.text[0]) / 2.3;           // time to read paragraph 1 before paragraph 2 appears
  const r2 = s.text[1] ? words(s.text[1]) / 2.3 : 0;
  const d = 1.2 + r1 + r2 + 4;                         // + hold
  const sc = { start: t0, end: t0 + d, p2: t0 + r1 };
  t0 += d + 0.2;                                       // fade out fully, a beat of background, then the next
  return sc;
});
T.fin = t0 + 0.4;
T.loopStart = T.fin + 14;
T.loopLen = P;
T.total = T.loopStart + P;

// ---------- DOM ----------
stage.insertAdjacentHTML('beforeend', `<section class="layer" id="hold"><div class="eb">${C.hold.eyebrow}</div><h2>${C.hold.title}</h2><div class="sub">${C.hold.sub}</div></section>`);
stage.insertAdjacentHTML('beforeend', `<section class="layer" id="open">
  <div class="greet">${C.greeting}</div>
  <h1><span class="s">Happy Birthday,</span><span class="n">${C.name}<span>.</span></span></h1>
  <div class="date">${C.date}</div></section>`);
C.scenes.forEach((s, i) => stage.insertAdjacentHTML('beforeend', `<section class="layer scene" id="s${i}">
  <div class="frame"><div class="im"><img src="${ph(s.photo)}" style="object-position:${s.pos || '50% 40%'};transform-origin:${s.pos || '50% 40%'}"></div></div>
  <div class="text"><div class="rule"></div>${s.text.map((p) => `<p>${p}</p>`).join('')}</div></section>`));
const F = C.finale, slots = [
  { x: 110, y: 170, w: 270, h: 350, r: -8 }, { x: 400, y: 120, w: 270, h: 350, r: -3 },
  { x: 700, y: 95, w: 520, h: 350, r: 0 }, { x: 1250, y: 120, w: 270, h: 350, r: 3 }, { x: 1540, y: 170, w: 270, h: 350, r: 8 }];
stage.insertAdjacentHTML('beforeend', `<section class="layer" id="fin">
  ${F.photos.map((p, i) => `<div class="pol" data-i="${i}" style="left:${slots[i].x}px;top:${slots[i].y}px;width:${slots[i].w}px;height:${slots[i].h}px"><div><img src="${ph(p)}" style="object-position:${(F.pos || [])[i] || '50% 40%'}"></div></div>`).join('')}
  <div class="title">${F.title.replace('!', '<span>!</span>')}</div>
  <div class="wish">${F.wish}</div><div class="sign">${F.sign}</div></section>`);
const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];

// ---------- confetti (periodic in P for the loop; bursts are one-offs) ----------
const cols = ['#e3c07a', '#e8a3a8', '#f6ece6', '#b88fc4'];
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const fall = (n) => Array.from({ length: n }, (_, i) => ({ x: rnd() * W, y: rnd() * (H + 80), k: 1 + (rnd() < .5 ? 0 : 1), m: 1 + Math.floor(rnd() * 2), amp: 10 + rnd() * 30, ph: rnd() * 6.28, rot: rnd() * 6.28, rn: (rnd() < .5 ? -1 : 1) * (1 + Math.floor(rnd() * 3)), s: 5 + rnd() * 5, c: cols[i % 4] }));
const gentle = fall(45), dense = fall(120);
const burst = (n) => Array.from({ length: n }, (_, i) => ({ x: W / 2 + (rnd() - .5) * 200, y: H * .62, vx: (rnd() - .5) * 1500, vy: -600 - rnd() * 900, rot: rnd() * 6.28, vr: (rnd() - .5) * 14, s: 6 + rnd() * 6, c: cols[i % 4] }));
const b1 = burst(220), b2 = burst(260);
const ctx = $('#fx').getContext('2d');
function drawFall(list, t, alpha) {
  if (alpha <= 0) return;
  for (const p of list) {
    const y = ((p.y + p.k * (H + 80) * (t / P)) % (H + 80)) - 40;
    const x = p.x + p.amp * Math.sin(2 * Math.PI * p.m * t / P + p.ph);
    ctx.save(); ctx.globalAlpha = alpha * .85; ctx.translate(x, y); ctx.rotate(p.rot + 2 * Math.PI * p.rn * t / P);
    ctx.fillStyle = p.c; ctx.fillRect(-p.s, -p.s / 2.5, p.s * 2, p.s / 1.25); ctx.restore();
  }
}
function drawBurst(list, dt) {
  if (dt < 0 || dt > 6) return;
  for (const p of list) {
    const x = p.x + p.vx * dt * Math.exp(-dt * .35), y = p.y + p.vy * dt + 520 * dt * dt;
    if (y > H + 40) continue;
    ctx.save(); ctx.globalAlpha = 1 - ease((dt - 4.5) / 1.5); ctx.translate(x, y); ctx.rotate(p.rot + p.vr * dt);
    ctx.fillStyle = p.c; ctx.fillRect(-p.s, -p.s / 2.5, p.s * 2, p.s / 1.25); ctx.restore();
  }
}

// ---------- render(t) ----------
const HOLD = C.hold.seconds;
window.TIMELINE = { ...T, hold: HOLD, loopStart: T.loopStart + HOLD, total: T.total + HOLD };
window.render = function (t) {
  const hd = $('#hold'), ha = ease((t - .5) / 1.5) * (1 - ease((t - (HOLD - 1.5)) / 1.5));
  hd.style.opacity = ha; hd.style.display = ha > 0 ? '' : 'none';
  if (t < HOLD - .01) { renderCard(-1, true); ctx.clearRect(0, 0, W, H); drawFall(gentle, t, .35 * ha); return; }
  renderCard(t - HOLD);
};
function renderCard(t, quiet) {
  // Opening: greeting, then the name, then the date
  const o = $('#open');
  o.style.opacity = 1 - ease((t - (T.openEnd - 1.2)) / 1.2);
  o.querySelector('.greet').style.opacity = ease((t - .5) / 1.4);
  const h = o.querySelector('h1'); h.style.opacity = ease((t - 2.6) / 1); h.style.transform = `scale(${0.92 + 0.08 * ease((t - 2.6) / 1.6)})`;
  o.querySelector('.date').style.opacity = ease((t - 4) / 1);
  // Scenes
  T.scenes.forEach((sc, i) => {
    const el = $(`#s${i}`), a = fade(t, sc.start, sc.end, 1.2, 1.2);
    el.style.opacity = a; el.style.display = a > 0 ? '' : 'none';
    if (!a) return;
    const k = clamp((t - sc.start) / (sc.end - sc.start));
    const dir = i % 2 ? -1 : 1;
    el.querySelector('img').style.transform = `scale(${1.04 + 0.1 * k}) translate(${dir * (k - .5) * 24}px, ${(k - .5) * -14}px)`;
    el.querySelector('.frame').style.transform = `rotate(${dir * -1.5}deg) translateY(${(1 - ease((t - sc.start) / 1.4)) * 30}px)`;
    const ps = el.querySelectorAll('p');
    ps[0].style.opacity = ease((t - sc.start - .7) / 1.2);
    if (ps[1]) { ps[1].style.opacity = ease((t - sc.p2) / 1.4); ps[1].style.transform = `translateY(${(1 - ease((t - sc.p2) / 1.4)) * 14}px)`; }
  });
  // Finale
  const f = $('#fin'), fa = ease((t - T.fin) / 1.2); f.style.opacity = fa;
  $$('#fin .pol').forEach((el, i) => {
    const s = slots[i], d = ease((t - T.fin - .3 * i) / 1.3);
    const bob = Math.sin(2 * Math.PI * (t / P) + i) * 5;
    el.style.opacity = d;
    el.style.transform = `translateY(${(1 - d) * 120 + bob}px) rotate(${s.r * d + (1 - d) * s.r * 3}deg)`;
  });
  f.querySelector('.title').style.opacity = ease((t - T.fin - 2.2) / 1.2);
  f.querySelector('.wish').style.opacity = ease((t - T.fin - 3.6) / 1.2);
  f.querySelector('.sign').style.opacity = ease((t - T.fin - 4.6) / 1.2);
  // Confetti
  if (quiet) return;
  ctx.clearRect(0, 0, W, H);
  drawFall(gentle, t, ease((t - 3) / 2) * (1 - ease((t - (T.openEnd - 1.5)) / 1.5)) * .7);   // opening only: keeps the file small enough for HA's upload
  drawFall(dense, t, ease((t - T.fin - 2) / 3) * (1 - ease((t - (T.loopStart - 4)) / 4)));   // settles to a still finale
  drawBurst(b1, t - 3.0);
  drawBurst(b2, t - (T.fin + 2.4));
}
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]);
const live = new URLSearchParams(location.search).has('live');
if (live) { const s = performance.now(); const loop = () => { let t = (performance.now() - s) / 1000; if (t > TIMELINE.total) t = TIMELINE.loopStart + ((t - TIMELINE.loopStart) % P); render(t); requestAnimationFrame(loop); }; loop(); }
else render(0);
</script>
</body></html>
