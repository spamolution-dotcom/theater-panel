<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17100B">
<title>Now showing</title>
<link rel="icon" href="/assets/icon.png">
<style>
  :root { --bg: #17100B; --ink: #F4ECE0; --muted: #B9A797; --gold: #E3A865; --line: #3A2A1E; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg) url(/assets/plaster.jpg) center/cover; color: var(--ink); font: 22px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; padding: 4vmin; }
  .board { width: min(100%, 1400px); display: flex; gap: 5vmin; align-items: stretch; }
  .poster { width: 34vmin; max-width: 420px; flex-shrink: 0; aspect-ratio: 2 / 3; border-radius: 2vmin; overflow: hidden; background: #221710; box-shadow: 0 3vmin 8vmin rgba(0,0,0,.6); }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .text { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2vmin; }
  .kicker { font-size: 2.6vmin; letter-spacing: .5vmin; text-transform: uppercase; color: var(--gold); }
  h1 { font-size: 9vmin; line-height: .95; margin: 0; text-transform: uppercase; font-weight: 800; letter-spacing: -.1vmin; text-wrap: balance; }
  .meta { font-size: 2.8vmin; color: var(--muted); }
  .times { display: flex; flex-wrap: wrap; gap: 2vmin 4vmin; margin-top: 1vmin; }
  .times div { display: flex; flex-direction: column; }
  .times b { font-size: 5vmin; line-height: 1; font-variant-numeric: tabular-nums; }
  .times span { font-size: 2.2vmin; letter-spacing: .3vmin; text-transform: uppercase; color: var(--muted); margin-top: .8vmin; }
  .now { color: var(--gold); }
  .idle { text-align: center; }
  .idle h1 { font-size: 8vmin; }
  .idle .meta { margin-top: 2vmin; }
  .clock { position: fixed; right: 4vmin; bottom: 3vmin; font-size: 3.2vmin; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="board"></div>
<div class="clock" id="clock"></div>
<script>
// The marquee: what is on tonight, when the doors open, when it starts, when it ends. Reads the
// plan every half minute; built through the DOM, nothing from the server is parsed as HTML.
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const at = (ms) => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const mins = (ms) => `${Math.round(ms / 60000)} min`;
function draw(d) {
  const board = $('board'); board.replaceChildren();
  const plan = d.plan, showing = d.showing;
  const item = plan?.item || showing;
  if (!item) {
    const idle = el('div', 'idle'); idle.append(el('div', 'kicker', 'Home theater'), el('h1', null, 'No show tonight'), el('div', 'meta', 'Pick something on the panel inside'));
    board.append(idle); return;
  }
  const wrap = el('div', 'board');
  const poster = el('div', 'poster'); if (item.poster) { const img = el('img'); img.src = item.poster; img.alt = ''; poster.append(img); }
  const text = el('div', 'text');
  const live = showing && (!plan || plan.state === 'feature' || plan.state === 'done');
  text.append(el('div', 'kicker', live ? (showing.state === 'paused' ? 'Intermission' : 'Now showing') : plan?.state === 'trailers' ? 'Coming attractions' : plan?.state === 'preshow' ? 'Doors open' : 'Tonight'));
  text.append(el('h1', null, item.showTitle ? `${item.showTitle}` : item.title));
  const meta = [item.year, item.contentRating, item.duration ? mins(item.duration) : null, item.quality?.res, (item.genres || []).slice(0, 2).join(', ')].filter(Boolean).join(' · ');
  text.append(el('div', 'meta', meta));
  const times = el('div', 'times');
  const slot = (label, when, now) => { const s = el('div', now ? 'now' : ''); s.append(el('b', null, when), el('span', null, label)); times.append(s); };
  if (plan?.times) {
    if (plan.trailers?.length) slot(`${plan.trailers.length} trailer${plan.trailers.length === 1 ? '' : 's'}`, at(plan.times.trailers), plan.state === 'trailers');
    else if (plan.times.preshow < plan.times.feature) slot('Doors', at(plan.times.preshow), plan.state === 'preshow');
    slot('Feature', at(plan.times.feature), plan.state === 'feature');
    if (plan.times.intermission) slot('Intermission', at(plan.times.intermission), false);
    slot('Ends', at(plan.times.ends), false);
  } else if (showing?.duration) {
    slot('Left', mins(showing.duration - showing.viewOffset), true);
    slot('Ends', at(d.now + showing.duration - showing.viewOffset), false);
  } else if (plan) {
    slot('Ready', 'when you are', true);
  }
  text.append(times);
  wrap.append(poster, text); board.append(wrap);
}
async function load() { try { draw(await (await fetch('/api/marquee')).json()); } catch {} }
setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }, 1000);
load(); setInterval(load, 30000);
</script>
</body>
</html>
