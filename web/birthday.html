<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f1426">
<title>Now showing</title>
<link rel="icon" href="/assets/icon.png">
<link rel="stylesheet" href="/birthday/birthday.css">
</head>
<body>
<!-- The birthday show's teaser. Everything personal stays in HA: the words come in the URL
     from the automation that opens this page, the poster from HA's media folder. -->
<main class="wrap" hidden>
  <figure class="poster"><img id="poster" alt=""><figcaption><span id="ptitle"></span><b id="credit"></b></figcaption></figure>
  <section class="info">
    <div class="eb">Now showing</div>
    <h1 id="title"></h1>
    <p class="tag" id="tagline"></p>
    <div class="meta" id="meta"></div>
    <button type="button" class="go" id="go">▶&nbsp; Start the show</button>
    <p class="small" id="hint">Tap to begin · then head to the cinema</p>
  </section>
</main>
<div class="curtain" id="curtain" hidden><div><div class="eb">The show is starting</div><h2 id="after">Head to the cinema room.</h2></div></div>
<script type="module" src="/birthday/birthday.js"></script>
</body>
</html>
