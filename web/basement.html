<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basement panel mockups</title>
<!--
  Mockups for the basement wall panel: 1280x800 on a 5" diagonal, so ~300 ppi and only about
  4.2" x 2.7" of glass. Everything is authored at a third of that (426 x 266 px) and the page is
  zoomed 3x, so a 44px row here is a 1.1 cm target on the wall and 15px text is ~3.7 mm tall.
  That constraint sets the whole design: six controls to a screen, no small print, and the level
  of a light is drawn as a fill so it reads from the sofa.

  The language is the theater panel's - plaster wall, plank rail, Big Shoulders caps, amber - and
  each variant is meant to be built as a Home Assistant dashboard from cards already installed:
  custom:grid-layout for the page, custom:button-card for tiles, mushroom light cards for rows,
  custom:ambient-light-card for the accents, custom:navbar-card for the rail.

    ?v=a  Zone grid   - six big zone tiles, tap to toggle, drag to dim
    ?v=b  Big rows    - five full-width rows that are themselves the sliders
    ?v=c  Scenes      - four huge scene tiles, one tap each
    ?v=d  One dial    - pick a zone; the ring's left half is brightness, right half warmth
    ?v=e  Master      - one whole-basement slider, zones and moods beside it
    ?v=f  Moods       - the accents' effects on their own page, six to a screen
-->
<script type="importmap">
{ "imports": {
  "preact": "/vendor/preact.mjs",
  "preact/hooks": "/vendor/preact-hooks.mjs",
  "htm": "/vendor/htm.mjs"
} }
</script>
<style>
  /* The panel's fonts, palette and textures, copied rather than linked: this page invents its own
     class names and styles.css already owns names like .scene and .track. */
  @font-face { font-family: 'Big Shoulders Display'; font-weight: 700; font-display: swap; src: url(/fonts/big-shoulders-display-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Big Shoulders Display'; font-weight: 800; font-display: swap; src: url(/fonts/big-shoulders-display-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 500; font-display: swap; src: url(/fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 600; font-display: swap; src: url(/fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 700; font-display: swap; src: url(/fonts/ibm-plex-sans-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 600; font-display: swap; src: url(/fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2'); }
  :root {
    --card: #F4F0E8; --line: #D6CCC0; --ink: #25170F; --muted: #5F5249; --track: #E4DCD2;
    --acc: #8F4E1C; --gold: #E3A865; --choc: #3A2419; --on-choc2: #C7B39E;
    --disp: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0907; overflow: hidden; display: grid; place-items: center; }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none; }
  canvas, img { display: block; }
  canvas.fx { width: 100%; }
  .tx-plaster { background: #D3CBC2 url(/assets/plaster.jpg) center / cover; }
  .tx-planks-rail { background: linear-gradient(rgba(28,24,20,.34), rgba(28,24,20,.34)), #6F6760 url(/assets/planks-rail.jpg) center / cover; }

  /* 426 x 266 authored, zoomed 3x onto the panel's 1280 x 800. */
  #page { width: 426.67px; height: 266.67px; zoom: 3; display: flex; overflow: hidden; flex-shrink: 0; }

  /* ---------- rail: three destinations, nothing smaller than a fingertip ---------- */
  .brail { width: 62px; flex-shrink: 0; padding: 8px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px;
           border-right: 2px solid #F1EDE4; box-shadow: 1px 0 0 #C9BFB2, 2px 0 7px rgba(20,10,5,.35); z-index: 2; }
  .brail .logo { font-family: var(--disp); font-weight: 800; font-size: 20px; line-height: 1; letter-spacing: .5px; color: #FFF8EE; text-shadow: 0 1px 3px rgba(0,0,0,.6); margin-bottom: 2px; }
  .brail a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 50px; height: 52px; border-radius: 13px;
             color: #FFF8EE; text-shadow: 0 1px 2px rgba(0,0,0,.75); font-size: 11px; font-weight: 700; letter-spacing: .3px; }
  .brail a.on { background: color-mix(in srgb, var(--acc) 90%, transparent); color: #fff; text-shadow: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 2px 5px rgba(0,0,0,.35); }
  .brail .grow { flex-grow: 1; }
  .brail .clock { font-family: var(--mono); font-size: 13px; font-weight: 600; color: #FFF8EE; text-shadow: 0 1px 2px rgba(0,0,0,.7); }

  /* ---------- shared ---------- */
  main.bmain { flex-grow: 1; min-width: 0; height: 266.67px; padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
  .bhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; height: 28px; }
  .bhead h1 { margin: 0; font-family: var(--disp); font-weight: 800; font-size: 27px; line-height: 1; text-transform: uppercase; color: var(--choc); }
  .bchip { height: 28px; padding: 0 11px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); font-size: 13px; font-weight: 600;
           display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .bchip.on { background: var(--choc); border-color: var(--choc); color: #F4F0E8; }
  .bcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 9px; min-height: 0; display: flex; flex-direction: column;
           box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 3px 8px rgba(58,36,25,.12); }
  .bcard.dark { background: #3A2419 url(/assets/suede.jpg) center / cover; color: #F4ECE0; border-color: #241710; }
  .bh2 { margin: 0 0 5px; font-family: var(--disp); font-weight: 700; font-size: 16px; letter-spacing: .5px; text-transform: uppercase; }

  /* Zone tile: tap toggles, dragging up its face dims. The level is the fill, so it reads from
     the sofa and is its own control. */
  .ztile { position: relative; border-radius: 14px; border: 1px solid var(--line); background: var(--card); overflow: hidden;
           display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 9px;
           box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 3px 8px rgba(58,36,25,.12); }
  .ztile .fill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(0deg, #C07A34, #EDBD7C); }
  .ztile .lab { position: relative; font-family: var(--disp); font-weight: 800; font-size: 22px; line-height: 1; text-transform: uppercase; }
  .ztile .val { position: relative; font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 1px; }
  .ztile.on { border-color: #C89B63; }
  .ztile.on .val { color: #4A3520; }
  .ztile .ic { position: absolute; top: 7px; right: 8px; color: var(--muted); }
  .ztile.on .ic { color: #6E4A21; }

  /* Full-width row that is its own slider. */
  .lrow { position: relative; border-radius: 14px; border: 1px solid var(--line); background: var(--card); overflow: hidden; flex-grow: 1;
          display: flex; align-items: center; gap: 10px; padding: 0 13px; box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 3px 8px rgba(58,36,25,.12); }
  .lrow .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #C07A34, #EDBD7C); }
  .lrow .ic, .lrow .nm, .lrow .val { position: relative; }
  .lrow .nm { font-family: var(--disp); font-weight: 800; font-size: 23px; text-transform: uppercase; line-height: 1; flex-grow: 1; }
  .lrow .val { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--muted); }
  .lrow.on .val { color: #4A3520; }

  /* Scene tile. */
  .scn { border-radius: 14px; border: 1px solid var(--line); background: var(--card); padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between;
         box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 3px 8px rgba(58,36,25,.12); color: var(--ink); }
  .scn .nm { font-family: var(--disp); font-weight: 800; font-size: 30px; line-height: .95; text-transform: uppercase; }
  .scn .sub { font-size: 13px; color: var(--muted); }
  .scn.on { background: var(--choc); border-color: var(--choc); color: #F4ECE0; }
  .scn.on .sub { color: var(--on-choc2); }

  /* Moods. */
  .mood { background: rgba(0,0,0,.3); border-radius: 10px; padding: 4px 5px 5px; }
  .mood .n { display: block; font-size: 11px; font-weight: 600; color: #E9DCCB; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mood.on { background: rgba(227,168,101,.22); box-shadow: inset 0 0 0 1.5px var(--gold); }
  .bcard.dark.sel { border-color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold), 0 3px 8px rgba(58,36,25,.12); }

  /* Dial. */
  .dial { position: relative; display: grid; place-items: center; }
  .dial .num { position: absolute; text-align: center; }
  .dial .num b { font-family: var(--disp); font-weight: 800; font-size: 64px; line-height: .85; color: var(--choc); }
  .dial .num span { display: block; font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .dial .num em { display: block; font-style: normal; font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--acc); margin-top: 3px; }
  .step { width: 34px; height: 34px; border-radius: 17px; background: rgba(0,0,0,.35); border: 1.5px solid rgba(227,168,101,.45); display: grid; place-items: center;
          box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 3px 8px rgba(58,36,25,.12); }
  .zpick { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 11px; border-radius: 12px;
           background: var(--card); border: 1px solid var(--line); font-size: 16px; font-weight: 700; }
  .zpick.on { background: var(--choc); border-color: var(--choc); color: #F4ECE0; }
  .zpick .v { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--muted); }
  .zpick.on .v { color: var(--gold); }

  .pwr { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center;
         background: rgba(0,0,0,.35); border: 1.5px solid rgba(244,236,224,.3); color: rgba(244,236,224,.7); }
  .pwr.on { background: var(--acc); border-color: var(--gold); color: #fff; box-shadow: 0 0 0 3px rgba(227,168,101,.22); }

  /* Master slider (E). */
  .master { position: relative; width: 116px; flex-shrink: 0; border-radius: 16px; overflow: hidden; border: 1px solid #C89B63; background: var(--card);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 12px; box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 3px 8px rgba(58,36,25,.12); }
  .master .fill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(0deg, #C07A34, #EDBD7C); }
  .master .big { position: relative; font-family: var(--disp); font-weight: 800; font-size: 58px; line-height: .85; color: var(--choc); }
  .master .lab { position: relative; font-family: var(--disp); font-weight: 800; font-size: 21px; text-transform: uppercase; color: var(--choc); line-height: 1.1; }
  .master .sub { position: relative; font-size: 12px; color: #4A3520; }
</style>
</head>
<body>
<div id="page"></div>
<script type="module">
import { render } from 'preact';
import { html, Icon } from '/lib/ui.mjs';
import { EffectPreview } from '/lib/effects.mjs';

const v = (new URLSearchParams(location.search).get('v') || 'a').toLowerCase();

// The basement's real light groups, with plausible levels so the mockups look lived-in.
const ZONES = [
  { n: 'Front', e: 'light.basement_front_center_lights', pct: 60, icon: 'bulb' },
  { n: 'Center', e: 'light.basement_center_lights', pct: 35, icon: 'bulb' },
  { n: 'Back', e: 'light.basement_back_center_lights', pct: 0, icon: 'bulb' },
  { n: 'Alley', e: 'light.basement_alley_lights', pct: 15, icon: 'bulb' },
  { n: 'Stairs', e: 'light.basement_basement_stairs', pct: 0, icon: 'chev' },
  { n: 'Accents', e: 'light.basement_accent_lights', pct: 45, icon: 'sun' },
];
const SCENES = [
  { n: 'Bright', d: 'Everything up', icon: 'sun' },
  { n: 'Movie', d: 'Down to 10%', icon: 'film' },
  { n: 'Game night', d: 'Accents only', icon: 'pad', on: true },
  { n: 'All off', d: 'Basement dark', icon: 'power' },
];
const FX = ['Candle Flicker', '2D Pacifica', 'Aurora', 'Rolling Fog'];
const on = (z) => z.pct > 0;
const lit = ZONES.filter(on).length;

const Rail = (active = 0) => html`<nav class="brail tx-planks-rail">
  <div class="logo">BC</div>
  ${[['Zones', 'bulb'], ['Scenes', 'sun'], ['Moods', 'moon']].map(([n, i], k) => html`
    <a class=${k === active ? 'on' : ''}><${Icon} name=${i} size=${22} />${n}</a>`)}
  <div class="grow"></div>
  <div class="clock">7:42</div>
</nav>`;

const Head = (title, chips = []) => html`<header class="bhead">
  <h1>${title}</h1>
  <div style="display:flex;gap:6px">${chips.map((c) => html`<span class=${`bchip ${c.on ? 'on' : ''}`}>${c.icon && html`<${Icon} name=${c.icon} size=${16} />`}${c.t}</span>`)}</div>
</header>`;

// ---------- A: six zone tiles ----------
const A = () => html`${Rail(0)}
  <main class="bmain tx-plaster">
    ${Head('Basement', [{ t: `${lit} of 6 on`, icon: 'bulb' }, { t: 'Game night', on: true }])}
    <div style="display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:8px;flex-grow:1;min-height:0">
      ${ZONES.map((z) => html`<div class=${`ztile ${on(z) ? 'on' : ''}`}>
        <div class="fill" style=${`height:${z.pct}%`}></div>
        <div class="ic"><${Icon} name=${z.icon} size=${18} /></div>
        <div class="lab">${z.n}</div>
        <div class="val">${z.pct ? `${z.pct}%` : 'Off'}</div>
      </div>`)}
    </div>
  </main>`;

// ---------- B: five big rows, each row is the slider ----------
const B = () => html`${Rail(0)}
  <main class="bmain tx-plaster">
    ${Head('Lights', [{ t: `${lit} on`, icon: 'bulb' }, { t: 'All off', icon: 'power' }])}
    <div style="display:flex;flex-direction:column;gap:7px;flex-grow:1;min-height:0">
      ${ZONES.slice(0, 5).map((z) => html`<div class=${`lrow ${on(z) ? 'on' : ''}`}>
        <div class="fill" style=${`width:${z.pct}%`}></div>
        <div class="ic"><${Icon} name=${z.icon} size=${21} /></div>
        <div class="nm">${z.n}</div>
        <div class="val">${z.pct ? `${z.pct}%` : 'OFF'}</div>
      </div>`)}
    </div>
  </main>`;

// ---------- C: four huge scenes ----------
const C = () => html`${Rail(1)}
  <main class="bmain tx-plaster">
    ${Head('Scenes', [{ t: `${lit} of 6 on`, icon: 'bulb' }])}
    <div style="display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;flex-grow:1;min-height:0">
      ${SCENES.map((s) => html`<div class=${`scn ${s.on ? 'on' : ''}`}>
        <${Icon} name=${s.icon} size=${26} />
        <div><div class="nm">${s.n}</div><div class="sub">${s.d}</div></div>
      </div>`)}
    </div>
  </main>`;

// ---------- D: instrument-cluster dial ----------
// A wide 270-degree arc that opens at the bottom, in the spirit of climate-cluster-card: the
// left sweep is brightness (copper, filled from the bottom), the right sweep is warmth (cool to
// candle), split at the top. Ticks and a teardrop pin on each, the number in the middle, the
// steppers in the opening. The selected zone is the highlighted row on the left, so the dial
// does not repeat its name.
const CX = 108, CY = 100, R = 76;
const pt = (deg, r = R) => [CX + r * Math.cos(deg * Math.PI / 180), CY + r * Math.sin(deg * Math.PI / 180)];
const arc = (a0, a1, r = R) => { const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r); return `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`; };
// angles clockwise from 3 o'clock (y down): 135 = bottom-left, 270 = top, 405 = bottom-right
const B0 = 135, B1 = 265, W0 = 275, W1 = 405;
const len = (a0, a1) => (a1 - a0) * Math.PI / 180 * R;
// The colour a gradient has at t (0..1), so a pin can match the track under it.
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (stops, t) => {
  const i = Math.min(stops.length - 2, Math.floor(t * (stops.length - 1))), f = t * (stops.length - 1) - i;
  const a = hex(stops[i]), b = hex(stops[i + 1]);
  return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(',')})`;
};
const WARM = ['#D7E6F0', '#F1D9A8', '#E39A3E'], BRIGHT = ['#8F4E1C', '#F0B76A'];
const pin = (deg, fill) => {                                    // teardrop on the track, tip inward
  const [x, y] = pt(deg);
  return html`<g transform=${`translate(${x} ${y}) rotate(${deg - 90})`}>
    <path d="M0 -17 C5.5 -8 7.5 -1 7.5 3 A7.5 7.5 0 0 1 -7.5 3 C-7.5 -1 -5.5 -8 0 -17z" fill=${fill} stroke="#FFF8EE" stroke-width="1.6" /></g>`;
};
const tick = (a, label) => {
  const [x0, y0] = pt(a, R + 13), [x1, y1] = pt(a, R + 19), [lx, ly] = pt(a, R + 29);
  return html`<line x1=${x0} y1=${y0} x2=${x1} y2=${y1} stroke="rgba(244,236,224,.45)" stroke-width="1.5" />
    ${label && html`<text x=${lx} y=${ly} fill="rgba(244,236,224,.55)" font-size="8" font-family="IBM Plex Mono" font-weight="600" text-anchor="middle" dominant-baseline="middle">${label}</text>`}`;
};
const Dial = ({ pct, warm, kelvin }) => html`<svg width="216" height="192" viewBox="0 0 216 192" style="overflow:visible;flex-shrink:0">
  <defs>
    <linearGradient id="warm" gradientUnits="userSpaceOnUse" x1=${pt(W0)[0]} y1=${pt(W0)[1]} x2=${pt(W1)[0]} y2=${pt(W1)[1]}>
      <stop offset="0" stop-color="#D7E6F0" /><stop offset=".5" stop-color="#F1D9A8" /><stop offset="1" stop-color="#E39A3E" /></linearGradient>
    <linearGradient id="bright" gradientUnits="userSpaceOnUse" x1=${pt(B0)[0]} y1=${pt(B0)[1]} x2=${pt(B1)[0]} y2=${pt(B1)[1]}>
      <stop offset="0" stop-color="#8F4E1C" /><stop offset="1" stop-color="#F0B76A" /></linearGradient>
  </defs>
  <!-- halos: a wider, faint copy of each sweep, so the arcs glow without a blur filter -->
  <path d=${arc(B0, B1)} fill="none" stroke="#E3A865" stroke-width="28" stroke-linecap="round" opacity=".10" />
  <path d=${arc(W0, W1)} fill="none" stroke="#F1D9A8" stroke-width="28" stroke-linecap="round" opacity=".10" />
  <!-- tracks -->
  <path d=${arc(B0, B1)} fill="none" stroke="rgba(244,236,224,.14)" stroke-width="13" stroke-linecap="round" />
  <path d=${arc(W0, W1)} fill="none" stroke="url(#warm)" stroke-width="13" stroke-linecap="round" opacity=".35" />
  <!-- brightness fills from the bottom; warmth lights up to the pin -->
  <path d=${arc(B0, B1)} fill="none" stroke="url(#bright)" stroke-width="13" stroke-linecap="round"
    stroke-dasharray=${`${len(B0, B1) * pct / 100} ${len(B0, B1) * 2}`} />
  <path d=${arc(W0, W1)} fill="none" stroke="url(#warm)" stroke-width="13" stroke-linecap="round"
    stroke-dasharray=${`${len(W0, W1) * warm} ${len(W0, W1) * 2}`} />
  ${tick(B0, '0')}${tick((B0 + B1) / 2, '50')}${tick(B1, '')}
  ${tick(W0, '')}${tick((W0 + W1) / 2, '4000')}${tick(W1, '2700')}
  ${pin(B0 + (B1 - B0) * pct / 100, mix(BRIGHT, pct / 100))}
  ${pin(W0 + (W1 - W0) * warm, mix(WARM, warm))}
  <!-- centre -->
  <text x=${CX + 2} y=${CY + 16} fill="#F4ECE0" font-size="60" font-family="Big Shoulders Display" font-weight="800" text-anchor="middle">${pct}<tspan font-size="22" fill="#E3A865">%</tspan></text>
  <text x=${CX} y=${CY + 36} fill="rgba(244,236,224,.7)" font-size="12" font-family="IBM Plex Mono" font-weight="600" text-anchor="middle">${kelvin} K</text>
  <!-- steppers in the opening -->
  ${[[-30, '−'], [30, '+']].map(([dx, g]) => html`<g>
    <circle cx=${CX + dx} cy=${CY + 68} r="15" fill="rgba(0,0,0,.35)" stroke="rgba(227,168,101,.5)" stroke-width="1.5" />
    <text x=${CX + dx} y=${CY + 69} fill="#E3A865" font-size="22" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" dominant-baseline="middle">${g}</text></g>`)}
</svg>`;
const D = () => html`${Rail(0)}
  <main class="bmain tx-plaster">
    <div style="display:grid;grid-template-columns:104px 1fr;gap:9px;flex-grow:1;min-height:0">
      <div style="display:flex;flex-direction:column;gap:6px">
        ${ZONES.slice(0, 5).map((z, i) => html`<div class=${`zpick ${i === 1 ? 'on' : ''}`} style="flex-grow:1;padding:0 10px;font-size:15px">

render(({ a: A, b: B, c: C, d: D, e: E, f: F }[v] || A)(), document.getElementById('page'));
