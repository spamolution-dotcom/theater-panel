# Builds the add-on image for HA Green (aarch64) and pushes it to GHCR, tagged with the version in
# theater_panel/config.yaml. Home Assistant pulls the tag that matches the version it sees there,
# so bump that version to ship an update.
name: Build add-on image

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'web/**'
      - 'package*.json'
      - 'theater_panel/**'
      - '.github/workflows/addon.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: meta
        run: |
          v=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' theater_panel/config.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/theater-panel-addon-aarch64" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: theater_panel/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_TIME=${{ steps.meta.outputs.time }}
            BUILD_ARCH=aarch64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
